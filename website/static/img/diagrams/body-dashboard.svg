<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bdTitle">
  <title id="bdTitle">A pretend body dashboard with five gauges: heart, breath, stomach, shoulders, and energy — each can read calm, medium, or revved-up</title>
  <rect x="1" y="1" width="858" height="418" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Your Body Dashboard</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Five gauges you can check any time. What is each one reading right now?</text>

  <!-- dashboard panel -->
  <rect x="45" y="90" width="770" height="230" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- five gauges -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <!-- gauge template: semicircle dial with needle -->
    <g transform="translate(125 200)">
      <path d="M-52,0 A52,52 0 0 1 52,0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <line x1="0" y1="0" x2="-26" y2="-38" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#1e293b"/>
      <text y="34" font-size="15" font-weight="700" fill="#5b21b6">HEART</text>
      <text y="54" font-size="12" fill="#64748b">slow &#8226; medium &#8226; racing</text>
    </g>
    <g transform="translate(278 200)">
      <path d="M-52,0 A52,52 0 0 1 52,0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#1e293b"/>
      <text y="34" font-size="15" font-weight="700" fill="#5b21b6">BREATH</text>
      <text y="54" font-size="12" fill="#64748b">easy &#8226; medium &#8226; quick</text>
    </g>
    <g transform="translate(431 200)">
      <path d="M-52,0 A52,52 0 0 1 52,0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <line x1="0" y1="0" x2="26" y2="-38" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#1e293b"/>
      <text y="34" font-size="15" font-weight="700" fill="#5b21b6">STOMACH</text>
      <text y="54" font-size="12" fill="#64748b">settled &#8226; flutters &#8226; knots</text>
    </g>
    <g transform="translate(584 200)">
      <path d="M-52,0 A52,52 0 0 1 52,0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <line x1="0" y1="0" x2="-18" y2="-42" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#1e293b"/>
      <text y="34" font-size="15" font-weight="700" fill="#5b21b6">SHOULDERS</text>
      <text y="54" font-size="12" fill="#64748b">loose &#8226; medium &#8226; tight</text>
    </g>
    <g transform="translate(737 200)">
      <path d="M-52,0 A52,52 0 0 1 52,0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <line x1="0" y1="0" x2="36" y2="-28" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="#1e293b"/>
      <text y="34" font-size="15" font-weight="700" fill="#5b21b6">ENERGY</text>
      <text y="54" font-size="12" fill="#64748b">low &#8226; medium &#8226; buzzing</text>
    </g>
  </g>

  <text x="430" y="356" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b">Try it: what would your dashboard show before a spelling test? After soccer? At a loud lunch table?</text>
  <text x="430" y="386" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">No reading is &#8220;bad.&#8221; The dashboard just gives you information sooner.</text>
</svg>
