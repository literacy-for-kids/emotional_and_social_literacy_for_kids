<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cfTitle">
  <title id="cfTitle">Camera facts versus brain story: the camera saw a friend walk past without waving; the brain wrote the story that the friend is mad at me; the next safe move is to check — say hi later and see what happens</title>
  <defs>
    <marker id="cfA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="438" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Camera Facts &#8594; Brain Story &#8594; Next Safe Move</text>

  <!-- camera facts -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="45" y="90" width="240" height="230" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <g transform="translate(165 145)">
      <rect x="-34" y="-20" width="68" height="44" rx="8" fill="#475569"/>
      <circle cy="2" r="14" fill="#f8fafc"/>
      <circle cy="2" r="7" fill="#475569"/>
      <rect x="-12" y="-30" width="24" height="12" rx="4" fill="#475569"/>
    </g>
    <text x="165" y="210" font-size="15" font-weight="800" fill="#334155">CAMERA FACTS</text>
    <text x="165" y="238" font-size="13" fill="#1e293b">what a camera would</text>
    <text x="165" y="256" font-size="13" fill="#1e293b">actually record</text>
    <text x="165" y="290" font-size="12.5" font-style="italic" fill="#64748b">&#8220;My friend walked past</text>
    <text x="165" y="307" font-size="12.5" font-style="italic" fill="#64748b">without waving.&#8221;</text>
  </g>

  <!-- brain story -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="310" y="90" width="240" height="230" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <g transform="translate(430 145)" fill="#7c3aed">
      <path d="M-30,10 a30,28 0 1 1 60,0 a14,13 0 0 1 -12,13 l-4,12 -12,-9 a40,40 0 0 1 -20,-6 a24,22 0 0 1 -12,-10z"/>
    </g>
    <text x="430" y="210" font-size="15" font-weight="800" fill="#5b21b6">BRAIN STORY</text>
    <text x="430" y="238" font-size="13" fill="#1e293b">the guess your brain</text>
    <text x="430" y="256" font-size="13" fill="#1e293b">writes about the facts</text>
    <text x="430" y="290" font-size="12.5" font-style="italic" fill="#64748b">&#8220;They&#8217;re mad at me.</text>
    <text x="430" y="307" font-size="12.5" font-style="italic" fill="#64748b">I did something wrong.&#8221;</text>
  </g>

  <!-- next safe move -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="575" y="90" width="240" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <g transform="translate(695 143)" stroke="#16a34a" fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M-22,2 L-4,20 L26,-16"/>
    </g>
    <text x="695" y="210" font-size="15" font-weight="800" fill="#166534">NEXT SAFE MOVE</text>
    <text x="695" y="238" font-size="13" fill="#1e293b">a small step that checks</text>
    <text x="695" y="256" font-size="13" fill="#1e293b">the story against reality</text>
    <text x="695" y="290" font-size="12.5" font-style="italic" fill="#64748b">&#8220;Say hi at lunch</text>
    <text x="695" y="307" font-size="12.5" font-style="italic" fill="#64748b">and see what happens.&#8221;</text>
  </g>

  <g stroke="#7c3aed" stroke-width="3">
    <line x1="285" y1="205" x2="306" y2="205" marker-end="url(#cfA)"/>
    <line x1="550" y1="205" x2="571" y2="205" marker-end="url(#cfA)"/>
  </g>

  <text x="430" y="365" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b">The story might be true. It might not. The camera only recorded one thing &#8212; someone walked by.</text>
  <text x="430" y="395" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Maybe they didn&#8217;t see you. Maybe they were having their own hard day. Checking beats guessing.</text>
</svg>
