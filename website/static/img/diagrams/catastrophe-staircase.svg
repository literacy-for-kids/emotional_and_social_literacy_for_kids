<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctTitle">
  <title id="ctTitle">The catastrophe staircase: forgot homework leads to teacher might be annoyed, then I will get in trouble, then everyone will think I am a mess — with an exit arrow back down to the one fact that is actually true</title>
  <defs>
    <marker id="ctA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ctG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="478" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Catastrophe Staircase</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Each step up is a bigger guess. Only the bottom step is a fact.</text>

  <!-- stairs -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" text-anchor="middle">
    <g>
      <rect x="60" y="360" width="185" height="58" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
      <text x="152" y="384" font-weight="700" fill="#166534">FACT</text>
      <text x="152" y="403" fill="#1e293b">I forgot my homework.</text>
    </g>
    <g>
      <rect x="255" y="280" width="185" height="58" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="347" y="304" font-weight="700" fill="#5b21b6">GUESS</text>
      <text x="347" y="323" fill="#1e293b">The teacher might be annoyed.</text>
    </g>
    <g>
      <rect x="450" y="200" width="185" height="58" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="542" y="224" font-weight="700" fill="#5b21b6">BIGGER GUESS</text>
      <text x="542" y="243" fill="#1e293b">I will get in trouble.</text>
    </g>
    <g>
      <rect x="645" y="120" width="185" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
      <text x="737" y="144" font-weight="700" fill="#991b1b">HUGE LEAP</text>
      <text x="737" y="163" font-size="12.5" fill="#1e293b">Everyone will think I&#8217;m a mess!</text>
    </g>
  </g>

  <!-- up arrows -->
  <g stroke="#7c3aed" stroke-width="2.5" fill="none">
    <line x1="248" y1="366" x2="288" y2="342" marker-end="url(#ctA)"/>
    <line x1="443" y1="286" x2="483" y2="262" marker-end="url(#ctA)"/>
    <line x1="638" y1="206" x2="678" y2="182" marker-end="url(#ctA)"/>
  </g>

  <!-- walk back down -->
  <path d="M737,185 C700,320 420,430 265,430 L180,430" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ctG)"/>
  <g stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="560" y="392" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">walk back down to the fact</text>
    <text x="560" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">&#8220;What do I actually know? What is just a story so far?&#8221;</text>
  </g>

  <text x="430" y="458" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Brains climb this staircase fast. Naming the steps slows the climb.</text>
</svg>
