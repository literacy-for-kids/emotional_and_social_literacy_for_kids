<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bmTitle">
  <title id="bmTitle">A neutral body outline with example body signals labeled: busy thoughts, hot cheeks, tight jaw, fast heartbeat, butterflies in the stomach, clenched fists, and wiggly legs — a map for pointing to where signals show up</title>
  <rect x="1" y="1" width="758" height="618" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Body Signal Map</text>
  <text x="380" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Where do your signals show up? You can point instead of talking.</text>

  <!-- body outline -->
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="3">
    <circle cx="380" cy="140" r="42"/>
    <path d="M380,182 L380,190 C330,195 310,225 308,275 L305,370 C305,385 320,385 322,372 L335,290 L335,420 L355,560 C357,575 377,575 378,560 L380,455 L382,560 C383,575 403,575 405,560 L425,420 L425,290 L438,372 C440,385 455,385 455,370 L452,275 C450,225 430,195 380,190 Z"/>
  </g>

  <!-- labels with pointer lines -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14">
    <g stroke="#a78bfa" stroke-width="2">
      <line x1="338" y1="115" x2="215" y2="105"/>
      <line x1="345" y1="160" x2="215" y2="175"/>
      <line x1="365" y1="230" x2="230" y2="250"/>
      <line x1="410" y1="320" x2="545" y2="300"/>
      <line x1="443" y1="360" x2="545" y2="380"/>
      <line x1="325" y1="345" x2="215" y2="330"/>
      <line x1="400" y1="490" x2="540" y2="470"/>
    </g>
    <g fill="#1e293b">
      <text x="205" y="100" text-anchor="end">busy, buzzing thoughts</text>
      <text x="205" y="180" text-anchor="end">hot cheeks &#183; tight jaw</text>
      <text x="220" y="255" text-anchor="end">fast heartbeat</text>
      <text x="555" y="295">shallow, quick breath</text>
      <text x="555" y="385">butterflies in the stomach</text>
      <text x="205" y="335" text-anchor="end">clenched fists</text>
      <text x="550" y="475">wiggly, jumpy legs</text>
    </g>
  </g>

  <text x="380" y="600" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">A body clue is information, not a problem. Noticing it is the whole skill this week.</text>
</svg>
